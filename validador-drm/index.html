.params{grid-column:1/-1;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.prog{height:6px;background:var(--soft)}

.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;position:relative;top:1px}
.pane{border-top:1px solid var(--line);padding:14px;min-width:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;max-height:430px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th{background:var(--head);color:var(--head-fg);font-weight:500;text-align:right;padding:8px 10px;white-space:nowrap;position:sticky;top:0}
th:first-child,td:first-child,th:nth-child(2){text-align:left}
td{padding:7px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
td.l{text-align:left}
tr.hl td{background:var(--hl)}
tr.sub td{background:var(--soft);font-weight:600}
td.neg{color:var(--warn)}
.st{font-family:var(--f-mono);font-size:.74rem;padding:2px 7px;border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.st.ok{color:var(--pos)} .st.run{color:var(--warn)} .st.err{color:var(--bad)}
.sev{display:inline-block;font-family:var(--f-mono);font-size:.7rem;padding:2px 7px;border-radius:4px;border:1px solid var(--line)}
.sev.c{color:var(--bad);border-color:var(--bad)} .sev.n{color:var(--pos)} .sev.x{color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:end;padding:16px 14px;border-bottom:1px solid var(--line)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.sum div{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px 12px}

.sum span{font-size:.8rem;color:var(--muted)}
.empty{padding:30px 14px;color:var(--muted);text-align:center}
.log{font-family:var(--f-mono);font-size:.76rem;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:190px;overflow-y:auto;color:var(--muted);margin:0 14px 14px;white-space:pre-wrap}
.note{font-size:.84rem;color:var(--muted);margin:10px 0 0}
.code{background:var(--code);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.code .cap{padding:8px 14px;font-family:var(--f-mono);font-size:.76rem;color:var(--muted);border-bottom:1px solid var(--line);background:var(--soft)}
.code pre{margin:0;padding:14px;overflow-x:auto;font-family:var(--f-mono);font-size:.8rem;line-height:1.55;color:var(--ink)}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tl .card .tag{font-family:var(--f-mono);font-size:.72rem;color:var(--accent)}
footer a{color:var(--accent)}
footer{border-top:1px solid var(--line);padding-top:18px;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

].join('\n');

/* ---------- Dados ficticios ---------- */
var DEPARA=[
 {r:"1.2.1.00.00-0",item:"A10",tipo:"Ativo",fat:""},{r:"1.2.2.00.00-3",item:"A10",tipo:"Ativo",fat:""},{r:"(1.2.9.00.00-1)",item:"A10",tipo:"Ativo",fat:""},
 {r:"1.6.1.10.00-5",item:"A20",tipo:"Ativo",fat:""},{r:"1.6.1.20.00-8",item:"A20",tipo:"Ativo",fat:""},{r:"(1.6.9.00.00-9)",item:"A20",tipo:"Ativo",fat:""},
 {r:"4.1.1.10.00-0",item:"P10",tipo:"Passivo",fat:"JT1"},{r:"4.1.1.20.00-3",item:"P10",tipo:"Passivo",fat:"JT1"},
 {r:"4.1.2.10.00-6",item:"P10",tipo:"Passivo",fat:"JT2"},{r:"4.3.1.00.00-4",item:"P30",tipo:"Passivo",fat:""}];

 {tipo:"Passivo",item:"P10",fat:"JT1",v:27000000},{tipo:"Passivo",item:"P10",fat:"JT2",v:5700000},{tipo:"Passivo",item:"P30",fat:"CDI",v:1800000},{tipo:"Passivo",item:"P30",fat:"PRE",v:1300000},
 {tipo:"Ativo",item:"A90",fat:"",v:700000},{tipo:"Passivo",item:"P90",fat:"",v:230000}];

var CARGAS=[
 {k:"fContabil",base:"bSaldo",y:false,rows:[["LCA",1.15,2000000,-1],["LCI",1.05,1000000,1],["CDB",1.00,3000000,1]]},
 {k:"fCredito",base:"bNominal",y:false,rows:[["CCB",1.20,500000,-1],["CCB",1.10,800000,-1]]},

var GRUPOS=null;
function grupos(){
  if(GRUPOS)return GRUPOS;var m={},o=[];
  DEPARA.forEach(function(x){var k=x.tipo+"|"+x.item+"|"+x.fat;if(!m[k]){m[k]={k:k,tipo:x.tipo,item:x.item,fat:x.fat,linhas:[]};o.push(m[k])}m[k].linhas.push(x)});
  GRUPOS=o;return o;
}
function conta(r){return r.replace(/[().]/g,"").replace(/-/g,"")}

/* ---------- Regras ---------- */
function limite(item,tipo,fat,padrao,usaExc){
  if(usaExc&&tipo&&fat&&TOL_ESP[item+"|"+tipo+"|"+fat]!==undefined)return [TOL_ESP[item+"|"+tipo+"|"+fat],1];
  if(TOL_ITEM[item]!==undefined)return [TOL_ITEM[item],3];
  return [padrao,4];
}
function pct(dif,base){if(base!==0)return dif/base*100;return dif===0?0:(dif>0?100:-100)}
function calcular(){
  var padrao=lerBR(document.getElementById("def").value);if(padrao===null)padrao=5;
  var usaExc=document.getElementById("exc").checked,gSel=document.getElementById("grp").value,v=parseFloat(document.getElementById("vr").value)||0;
  document.getElementById("vrv").textContent=(v>0?"+":"")+v+"%";
  var r={g:[],c:[],usos:{1:[],2:[],3:[],4:[]}};
  grupos().forEach(function(g){
    var bal=0,som=0,sub=0;
    g.linhas.forEach(function(l){var sinal=(l.r.indexOf("(")>=0&&l.r.indexOf(")")>=0)?-1:1,val=BAL[conta(l.r)]||0;bal+=sinal*val;if(sinal>0)som++;else sub++});
    var linhasD=DRM.filter(function(d){return d.tipo===g.tipo&&d.item===g.item&&(g.fat===""||d.fat===g.fat)});
    var drm=linhasD.reduce(function(a,b){return a+b.v},0);if(g.k===gSel)drm=drm*(1+v/100);
    var dif=drm-bal,p=pct(dif,bal),lim=limite(g.item,g.tipo,g.fat,padrao,usaExc);
    r.usos[lim[1]].push(g.item+(g.fat?" "+g.fat:""));
    r.g.push({g:g,bal:bal,drm:drm,dif:dif,p:p,lim:lim[0],nv:lim[1],ok:Math.abs(p)<=lim[0],som:som,sub:sub,amp:g.fat===""});
  });
  var tot={A90:{a:0,tipo:"Ativo"},P90:{a:0,tipo:"Passivo"}};r.det=[];
  CARGAS.forEach(function(c){var A=0,P=0;
    c.rows.forEach(function(x){if(x[1]>1&&!(c.y&&x[0]==="LFSC")){var val=x[2]*x[1]-x[2];if(x[3]<0)A+=val;else P+=val}});
    r.det.push({c:c,A:A,P:P});tot.A90.a+=A;tot.P90.a+=P});
  ["A90","P90"].forEach(function(it){
    var drm=DRM.filter(function(d){return d.item===it})[0].v,val=tot[it].a,dif=drm-val,p=drm!==0?dif/drm*100:(val===0?0:-100),lim=limite(it,tot[it].tipo,"",padrao,usaExc);
    r.usos[lim[1]].push(it);r.c.push({it:it,val:val,drm:drm,dif:dif,p:p,lim:lim[0],nv:lim[1],ok:Math.abs(p)<=lim[0]})});
  R=r;
  var n=r.g.length+r.c.length,ok=r.g.filter(function(x){return x.ok}).length+r.c.filter(function(x){return x.ok}).length;
  document.getElementById("status").textContent=ok+" / "+n+" "+t("rTot")+" · "+t("rOk");
  renderPane();
}

function tabela(cols,rows){return '<div class="tw"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>'}

function num(v){return '<td'+(v<0?' class="neg"':'')+'>'+fmt(v)+'</td>'}
function st(ok){return '<td class="l"><span class="sev '+(ok?'n':'c')+'">'+esc(ok?t("ok"):t("div"))+'</span></td>'}
function nvNome(n){return t("nv"+n)}
function renderTabs(){
  var ks=["tGrp","tTol","tCar","tRes"],h="";
  ks.forEach(function(k){h+='<button class="tab" role="tab" type="button" data-k="'+k+'" aria-selected="'+(aba===k)+'">'+esc(t(k))+'</button>'});
  var el=document.getElementById("tabs");el.innerHTML=h;
  Array.prototype.forEach.call(el.querySelectorAll(".tab"),function(b){b.onclick=function(){aba=b.getAttribute("data-k");renderTabs();renderPane()}});
}
function renderPane(){
  var el=document.getElementById("pane"),h="";if(!R){el.innerHTML="";return}
  if(aba==="tGrp"){
    h=tabela([t("cTipo"),t("cItem"),t("cFat"),t("cCor"),t("cCt"),t("cBal"),t("cDrm"),t("cDif"),t("cPerc"),t("cLim"),t("cReg"),t("cSt")],R.g.map(function(x){
      return '<tr'+(x.ok?'':' class="hl"')+'>'+td(x.g.tipo)+td(x.g.item)+td(x.g.fat||t("todos"))+td(x.amp?t("amp"):t("esp"))+td(x.som+" / "+x.sub)+num(x.bal)+num(x.drm)+num(x.dif)+'<td>'+fmt(x.p)+'%</td><td>'+fmt(x.lim)+'</td>'+td(nvNome(x.nv))+st(x.ok)+'</tr>'}));

      3:Object.keys(TOL_ITEM).map(function(k){return k+" = "+fmt(TOL_ITEM[k])+"%"}).join("; "),4:fmt(lerBR(document.getElementById("def").value)||5)+"%"};
    if(!document.getElementById("exc").checked)reg[1]=t("nenhuma");

  }else if(aba==="tCar"){
