<style>
/* Layout: coluna unica, caso no topo, demo do fluxo de criacao no meio, codigo e decisoes ao final */
:root{
  --bg:#eceff3; --panel:#ffffff; --ink:#0d1b2a; --muted:#566275; --line:#d5dae2; --soft:#f4f6f9;
  --accent:#a8500b; --accent-fg:#ffffff; --head:#13263d; --head-fg:#eef2f7;
  --pos:#1b7a4b; --warn:#9a6700; --warn-bg:#fff3d6; --bad:#b3261e; --code:#fafbfc; --hl:#fde9cf;
  --f-display:"Newsreader",Georgia,serif; --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1118; --panel:#131b25; --ink:#e8edf3; --muted:#93a0b2; --line:#26303d; --soft:#101821;
  --accent:#f0a35c; --accent-fg:#1a1006; --head:#1c2b3f; --head-fg:#eef2f7;
  --pos:#5fd08e; --warn:#f0c26a; --warn-bg:#2d2412; --bad:#ff8a80; --code:#0f161e; --hl:#3a2a14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1118; --panel:#131b25; --ink:#e8edf3; --muted:#93a0b2; --line:#26303d; --soft:#101821;
  --accent:#f0a35c; --accent-fg:#1a1006; --head:#1c2b3f; --head-fg:#eef2f7;
  --pos:#5fd08e; --warn:#f0c26a; --warn-bg:#2d2412; --bad:#ff8a80; --code:#0f161e; --hl:#3a2a14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);line-height:1.55;margin:0;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html{color-scheme:light}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:44px;min-width:0}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.top .id{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.ctrl{display:flex;gap:8px}
.chip{font:inherit;font-size:.8rem;font-family:var(--f-mono);padding:5px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2rem,5.4vw,3.4rem);line-height:1.08;margin:0 0 14px;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:1.7rem;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.lead{font-size:1.1rem;color:var(--muted);max-width:62ch;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.sec{display:flex;flex-direction:column;gap:18px;min-width:0}
.sec p.t{margin:0;max-width:66ch;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:1px solid var(--line);background:var(--panel);border-radius:8px}
.fact{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.fact:last-child{border-right:0}
.fact b{display:block;font-family:var(--f-mono);font-weight:500;font-size:1.9rem;line-height:1.1}
.fact span{color:var(--muted);font-size:.88rem}
@media (max-width:640px){.fact{border-right:0;border-bottom:1px solid var(--line)}.fact:last-child{border-bottom:0}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 6px;font-size:1rem}
.card p{margin:0;color:var(--muted);font-size:.93rem}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
.diagram svg{min-width:640px;width:100%;height:auto;display:block}
.bx{fill:var(--soft);stroke:var(--line);stroke-width:1.2}
.bx.k{fill:var(--head);stroke:var(--head)}
.bx.w{fill:var(--warn-bg);stroke:var(--warn)}
.dt{fill:var(--ink);font:500 13px var(--f-ui)}
.dt.k{fill:var(--head-fg)}
.ds{fill:var(--muted);font:400 11px var(--f-ui)}
.ds.k{fill:#b8c5d6}
.ar{stroke:var(--muted);stroke-width:1.4;fill:none}
.ar.d{stroke-dasharray:5 4;stroke:var(--warn)}
.arh{fill:var(--muted)}
/* demo */
.demo{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.dbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--head);color:var(--head-fg)}
.dbar b{font-weight:600}
.fict{font-family:var(--f-mono);font-size:.72rem;background:var(--warn-bg);color:var(--warn);padding:3px 8px;border-radius:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px;padding:16px 14px;border-bottom:1px solid var(--line);align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
label.ck{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink);cursor:pointer}
.in{font:inherit;font-size:.95rem;font-family:var(--f-ui);text-transform:none;letter-spacing:0;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.go{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.go[disabled]{opacity:.55;cursor:progress}
.params{grid-column:1/-1;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.prog{height:6px;background:var(--soft)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.status{padding:8px 14px;font-size:.82rem;color:var(--muted);font-family:var(--f-mono);border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0}
.tab{font:inherit;font-size:.88rem;padding:7px 12px;border:1px solid var(--line);border-bottom:0;background:var(--soft);color:var(--muted);border-radius:6px 6px 0 0;cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;position:relative;top:1px}
.pane{border-top:1px solid var(--line);padding:14px;min-width:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;max-height:430px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th{background:var(--head);color:var(--head-fg);font-weight:500;text-align:right;padding:8px 10px;white-space:nowrap;position:sticky;top:0}
th:first-child,td:first-child,th:nth-child(2){text-align:left}
td{padding:7px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
td.l{text-align:left}
tr.hl td{background:var(--hl)}
tr.sub td{background:var(--soft);font-weight:600}
td.neg{color:var(--warn)}
.st{font-family:var(--f-mono);font-size:.74rem;padding:2px 7px;border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.st.ok{color:var(--pos)} .st.run{color:var(--warn)} .st.err{color:var(--bad)}
.empty{padding:30px 14px;color:var(--muted);text-align:center}
.log{font-family:var(--f-mono);font-size:.76rem;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:190px;overflow-y:auto;color:var(--muted);margin:0 14px 14px;white-space:pre-wrap}
.note{font-size:.84rem;color:var(--muted);margin:10px 0 0}
.code{background:var(--code);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.code .cap{padding:8px 14px;font-family:var(--f-mono);font-size:.76rem;color:var(--muted);border-bottom:1px solid var(--line);background:var(--soft)}
.code pre{margin:0;padding:14px;overflow-x:auto;font-family:var(--f-mono);font-size:.8rem;line-height:1.55;color:var(--ink)}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tl .card .tag{font-family:var(--f-mono);font-size:.72rem;color:var(--accent)}
footer a{color:var(--accent)}
footer{border-top:1px solid var(--line);padding-top:18px;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

'STATUS_CONCLUIDO = {"SUCESSO", "AVISO"}',

'',
'def aguardar_status(self, rel_id: int, intervalo: int = 20,',
'                    limite_min: int = 60, max_404: int = 3) -> None:',
'    """Consulta o status por ID ate concluir, falhar ou estourar o limite."""',
'    inicio, falhas_404 = time.time(), 0',
'    while time.time() - inicio < limite_min * 60:',
'        time.sleep(intervalo)',
'        resp = self.consultar_status(rel_id)',
'        if resp.get("statusCode") == 404:',
'            falhas_404 += 1',
'            if falhas_404 >= max_404:',
'                raise RuntimeError(f"ID {rel_id} nao encontrado")',
'            continue',
'        falhas_404 = 0',
'        status = (resp.get("status") or "").upper().replace(" ", "_")',
'        if status in STATUS_CONCLUIDO:',
'            return',
'        if status == "ERRO":',
'            raise RuntimeError(resp.get("message", "erro no processamento"))',

].join('\n');

/* ---------- Estado e utilidades ---------- */
var lang="pt", rodando=false, aba="tFluxo", passos=[], listagem=[], consol={}, consSel=null;
function t(k){return (T[lang][k]!==undefined)?T[lang][k]:k}
function fmt(n){return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function lerPref(k){try{return localStorage.getItem(k)}catch(e){return null}}
function gravaPref(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- Simulacao da API (fictícia) ---------- */
var DATA_REF="22/10/2026";
var ENTIDADES=["A","B","C"];
var SUF=[["Banking_Padrao","Padrão","Standard"],["Banking_Interno","Interno","Internal"]];
var PRODUTOS=[["Ativo","Operações de crédito"],["Ativo","Títulos públicos"],["Ativo","Aplicações interfinanceiras"],["Passivo","Depósitos a prazo"],["Passivo","Depósitos à vista"],["Passivo","Letras de crédito"]];
var proxId=1046;
var api=[];
function semearApi(){api=[{id:1041,portfolio:"Z_Banking_Padrao",dataReferencia:"21/10/2026",status:"SUCESSO"},{id:1042,portfolio:"Z_Banking_Interno",dataReferencia:"21/10/2026",status:"SUCESSO"},{id:1043,portfolio:"Y_Banking_Padrao",dataReferencia:"21/10/2026",status:"SUCESSO"},{id:1044,portfolio:"Y_Banking_Interno",dataReferencia:"21/10/2026",status:"SUCESSO"},{id:1045,portfolio:"X_Banking_Padrao",dataReferencia:"22/10/2026",status:"EXECUTANDO"}];proxId=1046}
function fmtNum(v){return fmt(v)}
function gerarConsolidado(seed,interno){
  var r=mulberry(seed),o=[],i;
  for(i=0;i<PRODUTOS.length;i++){
    var base=(PRODUTOS[i][0]==="Ativo"?1:-1)*(1+r()*9)*1e5,k=interno?0.82:1;
    o.push({g:PRODUTOS[i][0],p:PRODUTOS[i][1],eA:-base*0.9*k,eB:base*1.05*k,nA:base*0.18*k,nB:-base*0.2*k});
  }
  return o;
}

/* ---------- Renderizacao ---------- */
function setStatus(s){document.getElementById("status").textContent=s}
function logar(s){var el=document.getElementById("log");el.textContent+=s+"\n";el.scrollTop=el.scrollHeight}
function barra(p){document.getElementById("pbar").style.width=p+"%"}
function stCls(s){return s==="SUCESSO"?"ok":(s==="ERRO"?"err":"run")}
function renderTabs(){
  var ks=["tFluxo","tList","tCons"],h="";
  ks.forEach(function(k){h+='<button class="tab" role="tab" type="button" data-k="'+k+'" aria-selected="'+(aba===k)+'">'+esc(t(k))+'</button>'});
  var el=document.getElementById("tabs");el.innerHTML=h;
  Array.prototype.forEach.call(el.querySelectorAll(".tab"),function(b){b.onclick=function(){aba=b.getAttribute("data-k");renderTabs();renderPane()}});
}
function tabela(cols,rows){
  var h='<div class="tw"><table><thead><tr>';
  cols.forEach(function(c){h+='<th>'+esc(c)+'</th>'});
  h+='</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>';return h;
}
function renderPane(){
  var el=document.getElementById("pane"),h;
  if(aba==="tFluxo"){
    if(!passos.length){el.innerHTML='<div class="empty">'+esc(t("empty"))+'</div>';return}
    h=tabela([t("cStep"),t("cDet")],passos.map(function(p){return '<tr'+(p.hl?' class="hl"':'')+'><td class="l">'+esc(p.a)+'</td><td class="l">'+esc(p.b)+'</td></tr>'}));
  }else if(aba==="tList"){
    h=tabela([t("cId"),t("cPort"),t("cData"),t("cSt")],api.map(function(r){
      return '<tr'+(r.novo?' class="hl"':'')+'><td class="l">'+r.id+'</td><td class="l">'+esc(r.portfolio)+'</td><td class="l">'+r.dataReferencia+'</td><td class="l"><span class="st '+stCls(r.status)+'">'+esc(r.status)+'</span></td></tr>'}));
  }else{
    var ks=Object.keys(consol);
    if(!ks.length){el.innerHTML='<div class="empty">'+esc(t("empty"))+'</div>';return}
    if(!consSel||!consol[consSel])consSel=ks[0];
    var opts=ks.map(function(k){return '<option value="'+esc(k)+'"'+(k===consSel?' selected':'')+'>'+esc(k)+'</option>'}).join("");
    var rows=consol[consSel].map(function(r){return '<tr><td class="l">'+esc(r.g)+'</td><td class="l">'+esc(r.p)+'</td>'+[r.eA,r.eB,r.nA,r.nB].map(function(v){return '<td'+(v<0?' class="neg"':'')+'>'+fmtNum(v)+'</td>'}).join("")+'</tr>'});
    h='<label class="f" style="max-width:320px;margin-bottom:10px"><span>'+esc(t("lcons"))+'</span><select class="in" id="selcons">'+opts+'</select></label>'+tabela([t("cGrp"),t("cProd"),t("cEveA"),t("cEveB"),t("cNiiA"),t("cNiiB")],rows);
  }
  el.innerHTML=h;
  var s=document.getElementById("selcons");if(s)s.onchange=function(){consSel=s.value;renderPane()};
}
function add(a,b,hl){passos.push({a:a,b:b,hl:!!hl});if(aba==="tFluxo")renderPane()}

/* ---------- Execucao da simulacao ---------- */
async function executar(){
  if(rodando)return;rodando=true;
  var btn=document.getElementById("run");btn.disabled=true;
  var sel=document.getElementById("ent").value,timeout=document.getElementById("cto").checked;
  var ents=sel==="*"?ENTIDADES:[sel],total=ents.length*SUF.length,n=0;
  passos=[];consol={};consSel=null;semearApi();
  document.getElementById("log").textContent="";renderPane();barra(0);
  var primeiro=true;
  for(var e=0;e<ents.length;e++){
    for(var s=0;s<SUF.length;s++){
      n++;var ent=ents[e],port=ent+"_"+SUF[s][0],rotulo="["+n+"/"+total+"] "+port;
      setStatus(t("running")+" "+rotulo);logar(rotulo);
      var antes={};api.forEach(function(r){antes[r.id]=1});
      add(rotulo+" · "+t("snap"),Object.keys(antes).length+" "+t("snapd"));await sleep(450);
      add(rotulo+" · "+t("dup"),t("dupd"));await sleep(350);
      var id=proxId++,perde=timeout&&primeiro;
      api.push({id:id,portfolio:port,dataReferencia:DATA_REF,status:"NA_FILA",novo:true,oculto:perde});
      var visivel=function(){return api.filter(function(r){return !r.oculto})};
      if(!perde){add(rotulo+" · "+t("post"),t("posto")+" (ID "+id+")");logar("  POST ok ID="+id);await sleep(500)}
      else{
        add(rotulo+" · "+t("post"),t("postt"),true);logar("  POST sem resposta em 60 s");await sleep(1200);
        add(rotulo+" · "+t("fb")+" 1/5",t("fbn"));logar("  tentativa 1/5: ainda nao aparece");await sleep(700);
        api.forEach(function(r){if(r.id===id)r.oculto=false});
        add(rotulo+" · "+t("fb")+" 2/5",t("fbo")+" (ID "+id+")",true);logar("  tentativa 2/5: encontrado ID="+id);await sleep(700);
        primeiro=false;
      }
      var me=api.filter(function(r){return r.id===id})[0];
      var sts=["NA_FILA","EXECUTANDO","EXECUTANDO","SUCESSO"];
      for(var q=0;q<sts.length;q++){
        me.status=sts[q];add(rotulo+" · "+t("poll"),sts[q]+(q===sts.length-1?"":" · +20 s"));logar("  status "+sts[q]);
        if(aba==="tList")renderPane();await sleep(420);
      }
      consol[port]=gerarConsolidado(ent.charCodeAt(0)*10+s,s===1);
      add(rotulo+" · "+t("cons"),t("consd"));barra(Math.round(n/total*100));await sleep(300);
      me.novo=false;
    }
  }
  setStatus(t("done")+": "+total+" portfolios");aba="tCons";renderTabs();renderPane();
  btn.disabled=false;rodando=false;
}

  var sel=document.getElementById("ent"),v=sel.value||"*",h='<option value="*">'+esc(t("all"))+'</option>';

}
function aplicarIdioma(){
  document.documentElement.lang=(lang==="pt"?"pt-BR":"en");
  var els=document.querySelectorAll("[data-i18n]"),i;
  for(i=0;i<els.length;i++){var k=els[i].getAttribute("data-i18n");if(T[lang][k]!==undefined)els[i].textContent=T[lang][k]}
  document.getElementById("l-pt").setAttribute("aria-pressed",lang==="pt");
  document.getElementById("l-en").setAttribute("aria-pressed",lang==="en");
  var dec=DEC[lang].map(function(d){return '<div class="card"><h3>'+esc(d[0])+'</h3><p>'+esc(d[1])+'</p></div>'}).join("");
  document.getElementById("dec").innerHTML=dec;
  document.getElementById("c1").textContent=C1;document.getElementById("c2").textContent=C2;
  document.title=T[lang].h1;

document.getElementById("l-en").onclick=function(){lang="en";gravaPref("lang","en");aplicarIdioma()};
document.getElementById("tema").onclick=function(){
  var r=document.documentElement,atual=r.getAttribute("data-theme");
  if(!atual)atual=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  var novo=atual==="dark"?"light":"dark";r.setAttribute("data-theme",novo);gravaPref("tema",novo)};
document.getElementById("run").onclick=executar;
(function(){
  var p=lerPref("lang");if(p==="pt"||p==="en")lang=p;
  else if((navigator.language||"").toLowerCase().indexOf("pt")!==0)lang="en";
  var th=lerPref("tema");if(th==="dark"||th==="light")document.documentElement.setAttribute("data-theme",th);
  semearApi();aplicarIdioma();
})();
