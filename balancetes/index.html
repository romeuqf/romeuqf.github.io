var C1=[
'def calcular_variacao_percentual(inicial: float, final: float) -> float:',
'    """Variacao percentual tratando zero e mudanca de sinal."""',
'    if inicial == 0 and final == 0:',
'        return 0.0',
'    if inicial == 0:',
'        return 100.0 if final > 0 else -100.0',
'    if (inicial < 0 < final) or (inicial > 0 > final):',
'        denominador = max(abs(inicial), abs(final))',
'        return (final - inicial) / denominador * 100',
'    return (final - inicial) / abs(inicial) * 100'
].join('\n');
var C2=[
'def classificar_criticidade(dif_abs: float, dif_perc: float,',
'                            limite_perc: float,',
'                            limite_valor: float | None = None) -> str | None:',
'    """Classifica a diferenca pelos limites de percentual e de valor."""',
'    passa_perc = bool(limite_perc) and dif_perc > limite_perc',
'    passa_valor = bool(limite_valor) and dif_abs > limite_valor',
'',
'    if not limite_valor:',
'        return "CRITICA_PERCENTUAL" if passa_perc else None',
'    if passa_perc and passa_valor:',
'        return "CRITICA_AMBOS"',
'    if passa_perc:',
'        return "CRITICA_PERCENTUAL"',
'    if passa_valor:',
'        return "CRITICA_VALOR"',
'    return None'
].join('\n');

var N1={"1.1.1":mk(1200000,3400000,3250000),"1.2.1":mk(8500000,2100000,1800000),"1.6.1":mk(42000000,6500000,5200000),"1.8.1":mk(1900000,80000,35000),

var MOV={"1.1.1":[3600000,3500000],"1.2.1":[1900000,2200000],"1.6.1":[7100000,5600000],"1.8.1":[60000,38000],"2.1.1":[10100000,10050000],"2.1.2":[3100000,2500000],"2.5.1":[250000,100000],"3.1.1":[0,80000],"6.1.1":[230000,0],"7.1.1":[0,410000]};
function montarFechado(){
  var o={},k;
  for(k in MOV){var ant=N1[k].atu;if(k==="2.1.2")ant+=45000;o[k]=mk(ant,MOV[k][0],MOV[k][1])}
  o["1.9.9"]=mk(0,150000,20000);return o;
}
function montarPrevio(f){
  var o={},k;for(k in f)o[k]={ant:f[k].ant,deb:f[k].deb,cre:f[k].cre,atu:f[k].atu};
  o["1.2.1"]=mk(f["1.2.1"].ant,f["1.2.1"].deb,1500000);
  o["2.1.1"]=mk(f["2.1.1"].ant,f["2.1.1"].deb+30000,f["2.1.1"].cre);

/* ---------- Regras (iguais as da aplicacao) ---------- */
function calcVar(i,f){
  if(i===0&&f===0)return 0;
  if(i===0)return f>0?100:-100;
  if((i<0&&f>0)||(i>0&&f<0))return (f-i)/Math.max(Math.abs(i),Math.abs(f))*100;
  return (f-i)/Math.abs(i)*100;
}
function crit(da,dp,lp,lv){
  var up=lp?dp>lp:false,uv=lv?da>lv:false;
  if(!lv)return up?"CRÍTICA_PERCENTUAL":null;
  if(up&&uv)return "CRÍTICA_AMBOS";if(up)return "CRÍTICA_PERCENTUAL";if(uv)return "CRÍTICA_VALOR";return null;
}
function conferir(){
  var lp=lerBR(document.getElementById("lim").value),usa=document.getElementById("usav").checked,lv=usa?lerBR(document.getElementById("val").value):null;
  var F=montarFechado(),P=montarPrevio(F),r={form:[],cont:[],comp:[],novas:[],excl:[],hist:{vg:[],ms:[],zer:[]}};
  [["prev",P],["fech",F]].forEach(function(par){
    Object.keys(par[1]).sort().forEach(function(c){var x=par[1][c],calc=x.ant+x.deb-x.cre,d=Math.abs(x.atu-calc);
      if(d>0)r.form.push({arq:par[0],c:c,x:x,calc:calc,d:d,cr:crit(d,Math.abs(calcVar(calc,x.atu)),lp,lv)})})});
  Object.keys(F).sort().forEach(function(c){if(N1[c]){var d=Math.abs(N1[c].atu-F[c].ant);if(d>0)r.cont.push({c:c,a:N1[c].atu,b:F[c].ant,d:d})}});
  Object.keys(F).sort().forEach(function(c){
    if(P[c]){var p=P[c],f=F[c],dif=f.atu-p.atu,dp=calcVar(p.atu,f.atu);
      var div=["ant","deb","cre","atu"].some(function(k){return Math.abs(f[k]-p[k])>0.01});
      r.comp.push({c:c,p:p.atu,f:f.atu,dif:dif,dp:dp,div:div,cr:crit(Math.abs(dif),Math.abs(dp),lp,lv)})}});
  Object.keys(F).sort().forEach(function(c){if(!N1[c])r.novas.push({c:c,s:F[c].atu})});
  Object.keys(N1).sort().forEach(function(c){if(!F[c])r.excl.push({c:c,s:N1[c].atu})});
  Object.keys(HIST.series).forEach(function(c){var s=HIST.series[c],i;
    for(i=0;i<s.length-1;i++){
      if(s[i]!==0){var v=Math.abs((s[i+1]-s[i])/s[i]*100);if(v>100)r.hist.vg.push({c:c,per:HIST.labels[i]+" → "+HIST.labels[i+1],a:s[i],b:s[i+1],v:v})}
      if((s[i]<0&&s[i+1]>0)||(s[i]>0&&s[i+1]<0))r.hist.ms.push({c:c,per:HIST.labels[i]+" → "+HIST.labels[i+1],a:s[i],b:s[i+1]})}
    if(s.length>=3&&s.every(function(x){return Math.abs(x)<0.01}))r.hist.zer.push(c)});
  r.nF=Object.keys(F).length;r.nP=Object.keys(P).length;
  R=r;
  document.getElementById("status").textContent=t("st")+": "+r.nF+" "+t("contas")+" ("+t("fech")+"), "+r.nP+" "+t("contas")+" ("+t("prev")+")";
  renderPane();
}

    var it=[[R.form.length,"resF"],[R.cont.length,"resC"],[crs,"resD"],[R.novas.length,"resN"],[R.excl.length,"resE"],[h2,"resH"]];
    h='<div class="sum">'+it.map(function(x){return '<div><b>'+x[0]+'</b><span>'+esc(t(x[1]))+'</span></div>'}).join("")+'</div>';
  }else if(aba==="tForm"){
    h=tabela([t("cConta"),t("cDesc"),t("cArq"),t("cAnt"),t("cDeb"),t("cCre"),t("cAtuInf"),t("cAtuCalc"),t("cDif"),t("cCrit")],R.form.map(function(x){

  }else if(aba==="tCont"){
    h=tabela([t("cConta"),t("cDesc"),t("cAtuN1"),t("cAntN"),t("cDif")],R.cont.map(function(x){return '<tr>'+td(x.c)+td(d(x.c))+num(x.a)+num(x.b)+num(x.d)+'</tr>'}));
  }else if(aba==="tComp"){
    h=tabela([t("cConta"),t("cDesc"),t("cPrev"),t("cFech"),t("cDif"),t("cPerc"),t("cDiv"),t("cCrit")],R.comp.map(function(x){
      return '<tr'+(x.cr?' class="hl"':'')+'>'+td(x.c)+td(d(x.c))+num(x.p)+num(x.f)+num(x.dif)+'<td>'+fmt(x.dp)+'%</td>'+td(x.div?t("sim"):t("nao"))+'<td>'+sev(x.cr)+'</td></tr>'}));
  }else if(aba==="tNE"){
    var rows=R.novas.map(function(x){return '<tr>'+td(x.c)+td(d(x.c))+td(t("novo"))+num(x.s)+'</tr>'}).concat(R.excl.map(function(x){return '<tr>'+td(x.c)+td(d(x.c))+td(t("excl"))+num(x.s)+'</tr>'}));
    h=tabela([t("cConta"),t("cDesc"),t("cTipo"),t("cSaldo")],rows);
  }else{
    var ks=Object.keys(HIST.series);
    h='<p class="note" style="margin:0 0 8px">'+esc(t("hSerie"))+'</p>'+tabela([t("cConta"),t("cDesc")].concat(HIST.labels),ks.map(function(c){return '<tr>'+td(c)+td(HIST.desc[c])+HIST.series[c].map(num).join("")+'</tr>'}));
    h+='<p class="note" style="margin:14px 0 8px">'+esc(t("hAnom"))+'</p>';
    var rr=R.hist.vg.map(function(x){return '<tr>'+td(x.c)+td(t("hVG"))+td(x.per)+num(x.a)+num(x.b)+'<td>'+fmt(x.v)+'%</td></tr>'}).concat(R.hist.ms.map(function(x){return '<tr>'+td(x.c)+td(t("hMS"))+td(x.per)+num(x.a)+num(x.b)+'<td>—</td></tr>'}));
    R.hist.zer.forEach(function(c){rr.push('<tr>'+td(c)+td(t("hZer"))+td("—")+num(0)+num(0)+'<td>—</td></tr>')});
    h+=tabela([t("cConta"),t("cTipo"),t("cPer"),t("cDe"),t("cPara"),t("cVar")],rr);
  }
  el.innerHTML=h;
}

function uiModo(){
  var m=(document.querySelector('input[name=modo]:checked')||{}).value||"a",h="";
  function linha(rot,val){return '<div class="rw"><span>'+esc(t(rot))+'</span><div class="fl">'+esc(val)+'</div></div>'}
  if(m==="a")h=linha("uf1","<raiz>\\Previos\\0000_balancete_09.2026.xlsx")+linha("uf2","<raiz>\\Fechados\\0000_balancete_09.2026.xlsx");
  else if(m==="p")h=linha("up1","<raiz>\\Previos")+linha("up2","<raiz>\\Fechados")+'<p class="note" style="margin:4px 0 0">'+esc(t("upn"))+'</p>';
  else h=linha("uh1","<raiz>\\Historico")+'<p class="note" style="margin:4px 0 0">'+esc(t("uhn"))+'</p>';
  document.getElementById("uisel").innerHTML=h;
}
Array.prototype.forEach.call(document.querySelectorAll('input[name=modo]'),function(r){r.addEventListener("change",uiModo)});
function aplicarIdioma(){
  document.documentElement.lang=(lang==="pt"?"pt-BR":"en");
  var els=document.querySelectorAll("[data-i18n]"),i;
  for(i=0;i<els.length;i++){var k=els[i].getAttribute("data-i18n");if(T[lang][k]!==undefined)els[i].textContent=T[lang][k]}
  document.getElementById("l-pt").setAttribute("aria-pressed",lang==="pt");
  document.getElementById("l-en").setAttribute("aria-pressed",lang==="en");
  document.getElementById("dec").innerHTML=DEC[lang].map(function(x){return '<div class="card"><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>'}).join("");
  document.getElementById("c1").textContent=C1;document.getElementById("c2").textContent=C2;
  document.title=T[lang].h1;renderTabs();conferir();uiModo();
}
document.getElementById("l-pt").onclick=function(){lang="pt";gravaPref("lang","pt");aplicarIdioma()};
document.getElementById("l-en").onclick=function(){lang="en";gravaPref("lang","en");aplicarIdioma()};
document.getElementById("tema").onclick=function(){
  var r=document.documentElement,atual=r.getAttribute("data-theme");
  if(!atual)atual=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  var novo=atual==="dark"?"light":"dark";r.setAttribute("data-theme",novo);gravaPref("tema",novo)};
document.getElementById("run").onclick=conferir;
["lim","val","usav"].forEach(function(id){document.getElementById(id).addEventListener("change",conferir)});
(function(){
  var p=lerPref("lang");if(p==="pt"||p==="en")lang=p;else if((navigator.language||"").toLowerCase().indexOf("pt")!==0)lang="en";
  var th=lerPref("tema");if(th==="dark"||th==="light")document.documentElement.setAttribute("data-theme",th);
  aplicarIdioma();
})();
</script>
