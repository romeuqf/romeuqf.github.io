function classificar(pctPr,lim){
  var r=lim?Math.abs(pctPr)/lim:0,f;
  if(r<=.33)f="Baixo";else if(r<=.87)f="Moderado";else if(r<=1)f="Alerta";else if(r<=1.33)f="Alto";else if(r<=2)f="MuitoAlto";else f="Critico";
  return {razao:r,faixa:f,ok:r<=1};
}

function gerar(e,mi){
  var r=mulberry(e.id*1000+mi*17+3),li=limites(e),i,ps=[],ativos=0,passivos=0;
  var split=(e.id===4);
  PRODS.forEach(function(p){
    var ruido=1+(r()-.5)*.10,sinal=p.ap==="a"?1:-1;
    ps.push({n:p.n,ap:p.ap,idx:p.idx,dur:p.dur*(p.ap==="p"?e.f:1),sens:p.sens,saldo:0,w:p.w*ruido,
      pct:p.pct+(p.pct?(r()-.5)*2:0),taxa:p.taxa+(r()-.5)*(p.idx==="Prefixado"?.9:.2),prazo:p.prazo+(r()-.5)*.1,cosif:p.cosif,sinal:sinal})
  });
  var somaA=0,somaP=0;ps.forEach(function(p){if(p.ap==="a")somaA+=p.w;else somaP+=p.w});
  var totalAtivo=e.pr*9.5*(1+(mi*.012));
  ps.forEach(function(p){p.saldo=p.sinal*totalAtivo*p.w/(p.ap==="a"?somaA:somaP)*(p.ap==="a"?1:.92)});
  /* choques de EVE brutos */
  var totA=0,totB=0;
  ps.forEach(function(p){p.eveA=-p.saldo*p.dur*.01;p.eveB=p.saldo*p.dur*.0095;totA+=p.eveA;totB+=p.eveB});
  var col=(totA>=totB&&totA>0)?"alta":((totB>totA&&totB>0)?"baixa":"alta");
  var tot=col==="alta"?totA:totB,alvoE=RE[e.id-1][mi]*li.eve*e.pr,s=tot!==0?alvoE/tot:1;
  ps.forEach(function(p){p.eveA*=s;p.eveB*=s;p.eve=col==="alta"?p.eveA:p.eveB});
  /* NII bruto, com correcao proporcional para atingir o alvo */
  var raw=0,wsum=0;
  ps.forEach(function(p){p.nii=p.sinal*Math.abs(p.saldo)*p.sens*.012;raw+=p.nii;p.wn=Math.abs(p.saldo)*p.sens;wsum+=p.wn});
  var alvoN=-RN[e.id-1][mi]*li.nii*e.pr;
  ps.forEach(function(p){p.nii+=(alvoN-raw)*p.wn/wsum});
  if(split){var q=ps[0],c=JSON.parse(JSON.stringify(q)),a=.35;c.n="Empréstimos Pré_0006";["saldo","eveA","eveB","eve","nii"].forEach(function(k){c[k]=q[k]*a;q[k]=q[k]*(1-a)});ps.splice(1,0,c)}
  var sa=0,sp=0,na=0,np=0,ea=0,ep=0;
  ps.forEach(function(p){if(p.ap==="a"){sa+=p.saldo;na+=p.nii;ea+=p.eve}else{sp+=p.saldo;np+=p.nii;ep+=p.eve}});
  var dn=na+np,de=ea+ep,prPrev=e.pr*(1+(r()-.5)*.02);
  var cN=classificar(dn/prPrev,li.nii),cE=classificar(de/prPrev,li.eve);
  return {e:e,mi:mi,ps:ps,col:col,sa:sa,sp:sp,na:na,np:np,ea:ea,ep:ep,dn:dn,de:de,pr:prPrev,limN:li.nii,limE:li.eve,cN:cN,cE:cE,
    nPct:dn/prPrev,ePct:de/prPrev,alN:Math.abs(dn/prPrev)>li.nii}
}
/* Conferencia balancete: agrupa por COSIF sem dupla contagem */
function conferir(res,tol){
  var bal={},grupos={},out=[],mi=res.mi,r=mulberry(res.e.id*77+mi*5+9);
  Object.keys(GN).forEach(function(g){grupos[g]={irrbb:0,prods:[]}});
  res.ps.forEach(function(p){var base=p.n.replace(/_\d+$/,""),def=PRODS.filter(function(x){return x.n===base})[0];grupos[def.cosif].irrbb+=Math.abs(p.saldo)});
  Object.keys(GN).forEach(function(g){
    var ruido=(r()-.5)*.05;
    if(res.e.id===3&&g==="G3")ruido=.19;
    if(res.e.id===5&&g==="G4")ruido=-.14;
    if(res.e.id===7&&g==="G2")ruido=.11;
    var b=grupos[g].irrbb*(1+ruido),d=b-grupos[g].irrbb,dp=b!==0?d/b:0;
    out.push({g:g,cosif:COSIF[g].join(", "),prods:GN[g],bal:b,irr:grupos[g].irrbb,d:d,dp:dp,erro:Math.abs(dp)>tol?1:0})
  });
  return out;
}

function logar(s){var el=document.getElementById("log");el.textContent+=s+"\n";el.scrollTop=el.scrollHeight}
function barra(p){document.getElementById("pbar").style.width=p+"%"}
function lerTol(){var s=document.getElementById("tol").value.replace(/\./g,"").replace(",",".").trim(),v=parseFloat(s);return (isFinite(v)&&v>=0&&/^[0-9.]+$/.test(s))?v/100:null}
async function executar(){
  if(rodando)return;
  var tol=lerTol();if(tol===null){setStatus(t("badTol"));return}
  var mi=MESES.indexOf(document.getElementById("mes").value),carga=document.getElementById("carga").checked;
  rodando=true;document.getElementById("run").disabled=true;document.getElementById("log").textContent="";barra(0);RES=null;renderPane();
  setStatus(t("run0")+"...");
  var ini=carga?0:mi,n=mi-ini+1,k,j;
  logar(t("l0"));await sleep(200);
  for(k=ini;k<=mi;k++){
    var m=MESES[k];logar(t("mesRef")+" "+m);
    await sleep(120);logar("   "+t("l1"));
    await sleep(120);logar("   "+t("l2"));
    await sleep(120);logar("   "+t("l3"));
    await sleep(120);logar("   "+t("l4"));
    var ja=!!DB[m];DB[m]={};
    ENT.forEach(function(e){DB[m][e.id]=gerar(e,k)});
    logar("   "+t("l5")+(ja?" ("+t("l5b")+")":"")+": "+ENT.length+" "+t("ent"));
    barra(Math.round((k-ini+1)/n*80));
    await sleep(160);
  }
  logar(t("l6"));await sleep(250);barra(100);
  logar(t("l7"));
  RES={mi:mi,tol:tol};
  setStatus(t("st")+": "+MESES[mi]);
  aba="tEnq";renderTabs();renderPane();
  document.getElementById("run").disabled=false;rodando=false;
}

/* ---------- Renderizacao ---------- */
function tabela(cols,rows){return '<div class="tw"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>'}
function td(s){return '<td class="l">'+esc(s)+'</td>'}
function renderTabs(){
  var ks=["tEnq","tProd","tVar","tBal","tHist"],h="";
  ks.forEach(function(k){h+='<button class="tab" role="tab" type="button" data-k="'+k+'" aria-selected="'+(aba===k)+'">'+esc(t(k))+'</button>'});
  var el=document.getElementById("tabs");el.innerHTML=h;
  Array.prototype.forEach.call(el.querySelectorAll(".tab"),function(b){b.onclick=function(){aba=b.getAttribute("data-k");renderTabs();renderPane()}});
}
function entSel(){return ENT[+document.getElementById("ent").value]}
function sev(c,txt){return '<span class="sev '+c+'">'+esc(txt)+'</span>'}
function graficoHist(e){
  var W=640,H=280,L=46,Rr=14,Tp=14,B=34,pts=[],i;
  MESES.forEach(function(m,k){if(DB[m]&&DB[m][e.id])pts.push({k:k,v:DB[m][e.id].cE.razao})});
  var mx=Math.max(1.2,Math.max.apply(null,pts.map(function(p){return p.v}))*1.1);
  function X(k){return L+(k/(MESES.length-1))*(W-L-Rr)}function Y(v){return Tp+(1-v/mx)*(H-Tp-B)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t("tHist"))+'">';
  for(i=0;i<=4;i++){var v=mx*i/4,y=Y(v);s+='<line class="ax" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y+'" y2="'+y+'"/><text class="tx" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fmtN(v,2)+'</text>'}
  MESES.forEach(function(m,k){s+='<text class="tx" x="'+X(k)+'" y="'+(H-12)+'" text-anchor="middle">'+m+'</text>'});
  s+='<line class="ln3" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(1)+'" y2="'+Y(1)+'"/><text class="tx" x="'+(W-Rr)+'" y="'+(Y(1)-5)+'" text-anchor="end">'+esc(t("limLn"))+'</text>';
  if(pts.length>1)s+='<polyline class="ln1" points="'+pts.map(function(p){return X(p.k)+","+Y(p.v)}).join(" ")+'"/>';
  pts.forEach(function(p){s+='<circle cx="'+X(p.k)+'" cy="'+Y(p.v)+'" r="4" fill="var(--accent)"/><text class="tx" x="'+X(p.k)+'" y="'+(Y(p.v)-9)+'" text-anchor="middle">'+fmtN(p.v,2)+'</text>'});
  return s+'</svg>';
}
function renderPane(){
  var el=document.getElementById("pane"),h="",R=RES;
  if(!R){el.innerHTML='<div class="empty">'+esc(t("empty"))+'</div>';return}
  var m=MESES[R.mi],D=DB[m],e=entSel();
  if(aba==="tEnq"){
    var cont={Baixo:0,Moderado:0,Alerta:0,Alto:0,MuitoAlto:0,Critico:0};
    ENT.forEach(function(x){cont[D[x.id].cE.faixa]++});
    h='<div class="faixas">'+Object.keys(cont).map(function(f){return '<div><b>'+cont[f]+'</b><span>'+esc(nomeFaixa(f))+'</span></div>'}).join("")+'</div>';
    h+=tabela([t("cEnt"),t("cTipo"),t("cSeg"),t("cPr"),t("cNii"),t("cNiiP"),t("cLimN"),t("cAlN"),t("cEve"),t("cEveP"),t("cLimE"),t("cFaixa"),t("cStat")],ENT.map(function(x){
      var r=D[x.id],f=FX[r.cE.faixa];
      return '<tr>'+td(nomeEnt(x))+td(x.central?t("central"):t("singular"))+td(x.seg)+'<td>'+fmtN(r.pr,0)+'</td><td>'+fmtN(r.dn,0)+'</td><td>'+pc(r.nPct)+'</td><td>'+pc(r.limN,0)+'</td><td>'+(r.alN?sev("c",t("sim")):sev("x",t("nao")))+'</td><td>'+fmtN(r.de,0)+'</td><td>'+pc(r.ePct)+'</td><td>'+pc(r.limE,0)+'</td><td>'+sev(f.c,nomeFaixa(r.cE.faixa))+'</td><td>'+sev(r.cE.ok?"n":"c",r.cE.ok?(lang==="pt"?"Enquadrado":"Within limit"):(lang==="pt"?"Desenquadrado":"Breach"))+'</td></tr>'}));
  }else if(aba==="tProd"){
    var r=D[e.id],ps=r.ps;
    h='<p class="note" style="margin:0 0 10px">'+esc(nomeEnt(e))+' · '+esc(m)+' · '+esc(t("colEve"))+' <b>'+esc(r.col==="alta"?t("alta"):t("baixa"))+'</b></p>';
    var rows=ps.map(function(p){return '<tr>'+td(p.n)+td(t(p.ap==="a"?"ativo":"passivo"))+td(p.idx)+'<td>'+fmtN(p.saldo,0)+'</td><td>'+fmtN(p.pct,1)+'</td><td>'+fmtN(p.taxa,2)+'</td><td>'+fmtN(p.prazo,2)+'</td><td>'+fmtN(p.nii,0)+'</td><td>'+fmtN(p.eve,0)+'</td></tr>'});
    function tot(nm,s,n,ev){return '<tr class="tot">'+td(nm)+'<td></td><td></td><td>'+fmtN(s,0)+'</td><td></td><td></td><td></td><td>'+fmtN(n,0)+'</td><td>'+fmtN(ev,0)+'</td></tr>'}
    rows.push(tot(t("totA"),r.sa,r.na,r.ea));rows.push(tot(t("totP"),r.sp,r.np,r.ep));rows.push(tot(t("totT"),r.sa+r.sp,r.dn,r.de));
    h+=tabela([t("cProd"),t("cAP"),t("cIdx"),t("cSaldo"),t("cPct"),t("cTaxa"),t("cPrazo"),t("cNii"),t("cEve")],rows);
  }else if(aba==="tVar"){
    var mp=MESES[R.mi-1];
    if(R.mi===0||!DB[mp]){h='<div class="empty">'+esc(t("semAnt"))+'</div>'}
    else{
      var cur=D[e.id].ps,ant={};DB[mp][e.id].ps.forEach(function(p){ant[p.n]=p});
      h='<p class="note" style="margin:0 0 10px">'+esc(nomeEnt(e))+' · '+esc(m)+' vs '+esc(mp)+'</p>';
      h+=tabela([t("cProd"),t("cVsaldo"),t("cVtaxa"),t("cVnii"),t("cVniiP"),t("cVeve"),t("cVeveP")],cur.map(function(p){
        var a=ant[p.n]||{saldo:0,taxa:0,nii:0,eve:0};
        var vn=p.nii-a.nii,ve=p.eve-a.eve,vnp=a.nii!==0?vn/Math.abs(a.nii):0,vep=a.eve!==0?ve/Math.abs(a.eve):0;
        return '<tr>'+td(p.n)+'<td>'+fmtN(p.saldo-a.saldo,0)+'</td><td>'+fmtN(p.taxa-a.taxa,2)+'</td><td>'+fmtN(vn,0)+'</td><td>'+pc(vnp,1)+'</td><td>'+fmtN(ve,0)+'</td><td>'+pc(vep,1)+'</td></tr>'}));
    }
  }else if(aba==="tBal"){
    var cf=conferir(D[e.id],R.tol),er=cf.filter(function(x){return x.erro}).length;
    h='<div class="sum"><div><b>'+cf.length+'</b><span>'+esc(t("nBalOk"))+'</span></div><div><b>'+er+'</b><span>'+esc(t("nBalErr"))+' (>'+pc(R.tol,2)+')</span></div></div>';
    h+=tabela([t("cCosif"),t("cProd"),t("cBal"),t("cIr"),t("cDrs"),t("cDp"),t("cRes")],cf.map(function(x){
      return '<tr>'+td(x.cosif)+td(x.prods)+'<td>'+fmtN(x.bal,0)+'</td><td>'+fmtN(x.irr,0)+'</td><td>'+fmtN(x.d,0)+'</td><td>'+pc(x.dp)+'</td><td>'+sev(x.erro?"c":"n",x.erro?t("erro"):t("ok"))+'</td></tr>'}));
  }else{
    var rows2=[];MESES.forEach(function(mm){if(DB[mm]&&DB[mm][e.id]){var q=DB[mm][e.id];rows2.push('<tr>'+td(mm)+'<td>'+pc(q.ePct)+'</td><td>'+pc(q.limE,0)+'</td><td>'+fmtN(q.cE.razao,2)+'</td><td>'+sev(FX[q.cE.faixa].c,nomeFaixa(q.cE.faixa))+'</td></tr>')}});
    h='<p class="note" style="margin:0 0 10px">'+esc(nomeEnt(e))+' · '+esc(t("histLeg"))+'</p><div class="chart">'+graficoHist(e)+'</div><div style="height:12px"></div>'+tabela([t("cMes"),t("cEveP"),t("cLimE"),t("cRazao"),t("cFaixa")],rows2);
  }
  el.innerHTML=h;
}
function montarSelects(){
  var ms=document.getElementById("mes"),es=document.getElementById("ent"),cm=ms.value||MESES[MESES.length-1],ce=es.value||"0";
  ms.innerHTML=MESES.map(function(m){return '<option'+(m===cm?' selected':'')+'>'+m+'</option>'}).join("");
  es.innerHTML=ENT.map(function(x,i){return '<option value="'+i+'"'+(String(i)===ce?' selected':'')+'>'+esc(nomeEnt(x))+'</option>'}).join("");
}
function aplicarIdioma(){
  document.documentElement.lang=(lang==="pt"?"pt-BR":"en");
  var els=document.querySelectorAll("[data-i18n]"),i;
  for(i=0;i<els.length;i++){var k=els[i].getAttribute("data-i18n");if(T[lang][k]!==undefined)els[i].textContent=T[lang][k]}
  document.getElementById("l-pt").setAttribute("aria-pressed",lang==="pt");
  document.getElementById("l-en").setAttribute("aria-pressed",lang==="en");
  document.getElementById("dec").innerHTML=DEC[lang].map(function(x){return '<div class="card"><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>'}).join("");
  document.getElementById("c1").textContent=C1;document.getElementById("c2").textContent=C2;
  document.title=T[lang].h1;montarSelects();renderTabs();renderPane();
  if(!rodando&&!RES)setStatus("");
}
document.getElementById("l-pt").onclick=function(){lang="pt";gravaPref("lang","pt");aplicarIdioma()};
document.getElementById("l-en").onclick=function(){lang="en";gravaPref("lang","en");aplicarIdioma()};
document.getElementById("tema").onclick=function(){
  var r=document.documentElement,atual=r.getAttribute("data-theme");
  if(!atual)atual=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  var novo=atual==="dark"?"light":"dark";r.setAttribute("data-theme",novo);gravaPref("tema",novo)};
document.getElementById("run").onclick=executar;
document.getElementById("ent").onchange=function(){renderPane()};
(function(){
  var p=lerPref("lang");if(p==="pt"||p==="en")lang=p;else if((navigator.language||"").toLowerCase().indexOf("pt")!==0)lang="en";
  var th=lerPref("tema");if(th==="dark"||th==="light")document.documentElement.setAttribute("data-theme",th);
  aplicarIdioma();
})();
</script>
