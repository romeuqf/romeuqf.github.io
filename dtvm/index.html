/* ---------- Dados fictícios e cálculo ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var INSTR=[
 {id:"LTN",vol:.0009,beta:.75},{id:"NTN-B",vol:.0016,beta:.8},{id:"LFT",vol:.0002,beta:.3},
 {id:"CDB",vol:.0003,beta:.35},{id:"Debêntures",vol:.0008,beta:.55},{id:"Futuro DI",vol:.0020,beta:.85},{id:"Ações",vol:.0120,beta:.5}];
var FUNDOS=[
 {cod:"0101",nome:"Fundo Alfa Renda Fixa Curto",mix:{"LTN":.30,"LFT":.45,"CDB":.25}},
 {cod:"0102",nome:"Fundo Beta Referenciado DI",mix:{"LFT":.55,"CDB":.30,"Debêntures":.15}},
 {cod:"0103",nome:"Fundo Gama Inflação",mix:{"NTN-B":.60,"LTN":.15,"Debêntures":.25}},
 {cod:"0104",nome:"Fundo Delta Multimercado",mix:{"LTN":.20,"Futuro DI":.25,"Ações":.25,"CDB":.30}},
 {cod:"0105",nome:"Fundo Épsilon Longo Prazo",mix:{"NTN-B":.45,"LTN":.25,"Futuro DI":.15,"LFT":.15}},
 {cod:"0106",nome:"Fundo Zeta Crédito Privado",mix:{"Debêntures":.50,"CDB":.30,"LFT":.20}}];
var MTM={"0101":84200000,"0102":132500000,"0103":61800000,"0104":47300000,"0105":98600000,"0106":72400000};
var COV=null;
function construirCov(){
  var N=252,L=.94,n=INSTR.length,rnd=mulberry(20261022),g=function(){var u=rnd()||1e-9,v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  var S=[],i,j,d,f,r;
  for(i=0;i<n;i++){S.push(new Array(n).fill(0))}
  for(d=0;d<N;d++){
    f=g(); r=INSTR.map(function(x){return x.vol*(x.beta*f+Math.sqrt(1-x.beta*x.beta)*g())});
    for(i=0;i<n;i++)for(j=0;j<n;j++){S[i][j]=(d===0)?r[i]*r[j]:L*S[i][j]+(1-L)*r[i]*r[j]}
  }
  return S;
}
function calcFundo(f,h){
  var S=COV,n=INSTR.length,Z=1.645,mtm=MTM[f.cod],w=INSTR.map(function(x){return f.mix[x.id]||0});
  var Sw=w.map(function(_,i){var s=0;for(var j=0;j<n;j++)s+=S[i][j]*w[j];return s});
  var v=0;for(var i=0;i<n;i++)v+=w[i]*Sw[i];
  var sp=Math.sqrt(v),sh=Math.sqrt(h),varP=Z*sp*sh*mtm,varAnual=Z*sp*Math.sqrt(252)*mtm,soma=0,linhas=[];
  for(var k=0;k<n;k++){
    if(!w[k])continue;
    var mi=w[k]*mtm,vi=Z*Math.sqrt(S[k][k])*sh*mi;
    soma+=vi;
    linhas.push({instr:INSTR[k].id,mtm:mi,v:vi,va:Z*Math.sqrt(S[k][k])*Math.sqrt(252)*mi,comp:Z*sh*mtm*w[k]*Sw[k]/sp});
  }
  return {total:{mtm:mtm,v:varP,va:varAnual,ef:varP-soma},inst:linhas};
}

}

    R.forEach(function(r){r[h].inst.forEach(function(i){L+='<tr><td class="l">'+r.f.cod+'</td><td class="l">'+esc(i.instr)+'</td><td>'+fmt(i.mtm)+'</td><td>'+fmt(i.v)+'</td><td>'+fmt(i.va)+'</td><td>'+fmt(i.comp)+'</td></tr>'})});

      corpo='<div class="tw xl"><table><thead><tr><th>Portfolio</th><th>Instrumento</th><th>MtM</th><th>VaR</th><th>VaR Anual</th><th>VaR Componente</th></tr></thead><tbody>'+L2+'</tbody></table></div>';

  }
}
function log(s){var l=document.getElementById("log");l.textContent+=s+"\n";l.scrollTop=l.scrollHeight}

/* ---------- Execução simulada ---------- */
async function executar(){
  if(rodando)return;rodando=true;
  var btn=document.getElementById("run"),st=document.getElementById("status"),pb=document.getElementById("pbar");
  btn.disabled=true;document.getElementById("log").textContent="";ultimo=null;desenhaPane();
  var sel=document.getElementById("port").value,lista=(sel==="ALL")?FUNDOS:FUNDOS.filter(function(f){return f.cod===sel});
  var total=lista.length*2,n=0,out=[];
  if(!COV)COV=construirCov();
  log("VaR Perfil Mensal | "+document.getElementById("data").value+" | "+lista.length+" x 2 = "+total+" "+t("calls"));
  for(var i=0;i<lista.length;i++){
    var f=lista[i],par={f:f};
    for(var hh=0;hh<2;hh++){
      var h=hh===0?21:1;n++;
      st.textContent=t("running")+" ["+n+"/"+total+"] "+f.cod+" (h="+h+")...";
      log("["+n+"/"+total+"] POST "+f.cod+" h="+h+" conf=95");
      await sleep(260);
      par[h===21?"h21":"h1"]=calcFundo(f,h);
      pb.style.width=Math.round(n/total*100)+"%";
      log("    status: SUCESSO");
    }
    out.push(par);
  }
  ultimo=out;st.textContent=t("done")+" - "+total+" "+t("calls");
  btn.disabled=false;rodando=false;desenhaPane();
}
