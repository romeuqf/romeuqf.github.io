var PRAZOS=[[1,"1 dia","1 day"],[21,"1 mês","1 month"],[42,"2 meses","2 months"],[63,"3 meses","3 months"],[84,"4 meses","4 months"],[105,"5 meses","5 months"],[126,"6 meses","6 months"],[147,"7 meses","7 months"],[168,"8 meses","8 months"],[189,"9 meses","9 months"],[210,"10 meses","10 months"],[231,"11 meses","11 months"],[252,"1 ano","1 year"],[378,"1,5 ano","1.5 years"],[504,"2 anos","2 years"],[630,"2,5 anos","2.5 years"],[756,"3 anos","3 years"],[882,"3,5 anos","3.5 years"],[1008,"4 anos","4 years"],[1134,"4,5 anos","4.5 years"],[1260,"5 anos","5 years"]];

var lang="pt";
function t(k){return (T[lang][k]!==undefined)?T[lang][k]:k}
function fmtN(n,d){return n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pad(n){return (n<10?"0":"")+n}
function fmtData(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()}
function lerData(s){var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s).trim());if(!m)return null;var d=new Date(+m[3],+m[2]-1,+m[1]);return (d.getDate()===+m[1]&&d.getMonth()===+m[2]-1)?d:null}
function pascoa(a){var c=Math.floor(a/100),n=a-19*Math.floor(a/19),k=Math.floor((c-17)/25),i=c-Math.floor(c/4)-Math.floor((c-k)/3)+19*n+15;i=i-30*Math.floor(i/30);i=i-Math.floor(i/28)*(1-Math.floor(i/28)*Math.floor(29/(i+1))*Math.floor((21-n)/11));var j=a+Math.floor(a/4)+i+2-c+Math.floor(c/4);j=j-7*Math.floor(j/7);var l=i-j,m=3+Math.floor((l+40)/44),d=l+28-31*Math.floor(m/4);return new Date(a,m-1,d)}
var FER={};
function feriado(d){var a=d.getFullYear();if(!FER[a]){var s={},f=[[1,1],[4,21],[5,1],[9,7],[10,12],[11,2],[11,15],[12,25]];f.forEach(function(x){s[x[0]+"-"+x[1]]=1});var p=pascoa(a);p.setDate(p.getDate()-2);s[(p.getMonth()+1)+"-"+p.getDate()]=1;FER[a]=s}return !!FER[a][(d.getMonth()+1)+"-"+d.getDate()]}
function ehUtil(d){return d.getDay()!==0&&d.getDay()!==6&&!feriado(d)}
function diaUtilAnterior(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);while(!ehUtil(x))x.setDate(x.getDate()-1);return x}

function chave(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}

/* ---------- Curva sintetica (Nelson-Siegel com choques diarios) ---------- */
function curva(d){
  var r=mulberry(Math.floor(d.getTime()/86400000)),b0=13.1+(r()-.5)*.30,b1=-2.0+(r()-.5)*.90,b2=1.4+(r()-.5)*1.1,tau=1.6,datas=[],x=new Date(d.getTime()),du,out=[];
  for(du=1;du<=MAXDU;du++){do{x.setDate(x.getDate()+1)}while(!ehUtil(x));var tt=du/252,e=(1-Math.exp(-tt/tau))/(tt/tau),taxa=b0+b1*e+b2*(e-Math.exp(-tt/tau));out.push({du:du,data:fmtData(x),taxa:taxa})}
  return out;
}
function corVar(v,mn,mx){
  if(mn===null||mx===null||mx===mn)return v>0?"#ffcccc":(v<0?"#ccffcc":"#ffffff");
  var n=(v-mn)/(mx-mn),r,g,b;
  if(n<=.5){var q=n*2;r=Math.floor(q*255);g=128+Math.floor(q*127);b=0}else{var q2=(n-.5)*2;r=255;g=255-Math.floor(q2*255);b=0}
  function h(z){return (z<16?"0":"")+Math.max(0,Math.min(255,z)).toString(16)}
  return "#"+h(r)+h(g)+h(b);
}
function vertices(dus){var o=[];PRAZOS.forEach(function(p){var best=dus[0];dus.forEach(function(x){if(Math.abs(x-p[0])<Math.abs(best-p[0]))best=x});if(Math.abs(best-p[0])<=15)o.push({du:best,p:p})});return o}

/* ---------- Pipeline ---------- */
function setStatus(s){document.getElementById("status").textContent=s}

function barra(p){document.getElementById("pbar").style.width=p+"%"}
async function executar(){
  if(rodando)return;
  var d=lerData(document.getElementById("dt").value);
  if(!d){setStatus(t("badData"));return}
  if(!ehUtil(d)){setStatus(t("badUtil"));return}
  rodando=true;document.getElementById("run").disabled=true;document.getElementById("log").textContent="";barra(0);RES=null;renderPane();
  setStatus(t("run0")+"...");
  if(document.getElementById("vazio").checked)DB={};
  var k=chave(d);logar(t("l0"));await sleep(250);
  logar(t("l1"));var dados=curva(d);await sleep(450);logar("   "+t("l1b"));barra(15);
  logar(t("l2"));await sleep(350);logar("   "+dados.length+" "+t("l2b"));barra(30);
  logar(t("l3"));await sleep(350);
  var subst=DB[k]?DB[k].length:0;if(subst)logar("   "+subst+" "+t("l3b"));
  DB[k]=dados;logar("   "+dados.length+" "+t("l3c"));barra(50);
  logar(t("l3d"));await sleep(350);
  var iso=Object.keys(DB).filter(function(x){return x<k}).sort().reverse()[0],dAnt;
  if(iso){logar("   "+t("l3f")+": "+fmtData(new Date(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))))}
  else{dAnt=diaUtilAnterior(d);logar("   "+t("l3e")+" ("+fmtData(dAnt)+")");await sleep(450);DB[chave(dAnt)]=curva(dAnt);iso=chave(dAnt)}
  barra(65);
  logar(t("l4"));await sleep(350);barra(80);
  logar(t("l5"));await sleep(400);barra(100);
  logar(t("l6"));
  var dus=dados.map(function(x){return x.du}),vs=vertices(dus),ant=DB[iso];
  var linhas=vs.map(function(v){var a=dados[v.du-1],b=ant[v.du-1];return {du:v.du,pz:v.p,data:a.data,taxa:a.taxa,tant:b.taxa,v:a.taxa-b.taxa}});
  RES={ref:fmtData(d),ant:fmtData(new Date(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))),linhas:linhas,dados:dados,antd:ant,vs:vs,omit:PRAZOS.filter(function(p){return !vs.some(function(v){return v.p===p})}).map(function(p){return p[lang==="pt"?1:2]})};
  setStatus(t("st")+": "+RES.ref+" vs "+RES.ant);
  aba="tComp";renderTabs();renderPane();
  document.getElementById("run").disabled=false;rodando=false;
}

  document.getElementById("l-en").setAttribute("aria-pressed",lang==="en");
  document.getElementById("dec").innerHTML=DEC[lang].map(function(x){return '<div class="card"><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p></div>'}).join("");
  document.getElementById("c1").textContent=C1;document.getElementById("c2").textContent=C2;
  document.title=T[lang].h1;renderTabs();renderPane();
  if(!rodando&&!RES)setStatus("");
}
document.getElementById("l-pt").onclick=function(){lang="pt";gravaPref("lang","pt");aplicarIdioma();if(RES){RES.omit=PRAZOS.filter(function(p){return !RES.vs.some(function(v){return v.p===p})}).map(function(p){return p[1]});renderPane()}};
document.getElementById("l-en").onclick=function(){lang="en";gravaPref("lang","en");aplicarIdioma();if(RES){RES.omit=PRAZOS.filter(function(p){return !RES.vs.some(function(v){return v.p===p})}).map(function(p){return p[2]});renderPane()}};
document.getElementById("tema").onclick=function(){
  var r=document.documentElement,atual=r.getAttribute("data-theme");
  if(!atual)atual=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  var novo=atual==="dark"?"light":"dark";r.setAttribute("data-theme",novo);gravaPref("tema",novo)};
document.getElementById("run").onclick=executar;
(function(){
  var p=lerPref("lang");if(p==="pt"||p==="en")lang=p;else if((navigator.language||"").toLowerCase().indexOf("pt")!==0)lang="en";
  var th=lerPref("tema");if(th==="dark"||th==="light")document.documentElement.setAttribute("data-theme",th);
  document.getElementById("dt").value=fmtData(dataPadrao());
  aplicarIdioma();
})();
</script>
